<style>
  .card {
    fill:#0C1426;
    stroke:#22D3EE;
    stroke-opacity:.28;
    transition:.3s;
  }

  .card:hover {
    stroke:#22D3EE;
    stroke-opacity:.8;
  }

  .title {
    fill:#F8FAFC;
    font:600 20px ui-monospace,SFMono-Regular,Menlo,monospace;
  }

  .desc {
    fill:#94A3B8;
    font:14px ui-monospace,SFMono-Regular,Menlo,monospace;
  }

  .tag {
    fill:#7C3AED;
    fill-opacity:.25;
    stroke:#A78BFA;
    stroke-opacity:.5;
  }

  .tagText {
    fill:#EDE9FE;
    font:12px ui-monospace,SFMono-Regular,Menlo,monospace;
  }

  .dot {
    fill:#10B981;
  }

  .arrow {
    fill:#22D3EE;
    font:24px sans-serif;
  }

  @media (prefers-color-scheme: light) {
    .card {
      fill:#FFFFFF;
      stroke:#0891B2;
      stroke-opacity:.30;
    }

    .card:hover {
      stroke:#0891B2;
      stroke-opacity:.8;
    }

    .title {
      fill:#0F172A;
    }

    .desc {
      fill:#475569;
    }

    .tag {
      fill:#7C3AED;
      fill-opacity:.12;
      stroke:#7C3AED;
      stroke-opacity:.4;
    }

    .tagText {
      fill:#475569;
    }

    .arrow {
      fill:#0891B2;
    }
  }
</style>


